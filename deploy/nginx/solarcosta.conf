# Nginx — Solar Costa
#
# Serve o front (build estático do Vite) e faz proxy da API na mesma origem.
# Com isso o CORS deixa de existir: o navegador só fala com um domínio.
#
# Instalação:
#   sudo cp solarcosta.conf /etc/nginx/sites-available/solarcosta
#   sudo ln -s /etc/nginx/sites-available/solarcosta /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d crm.solarcosta.com.br      # emite e configura o TLS
#   sudo nginx -t && sudo systemctl reload nginx
#
# Troque crm.solarcosta.com.br pelo domínio real antes de aplicar.

# ---------------------------------------------------------------------------
# Redireciona todo HTTP para HTTPS.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name crm.solarcosta.com.br;

    # O certbot precisa deste caminho para renovar o certificado.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# Aplicação
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # `http2 on` só existe a partir do Nginx 1.25.1. Em versões anteriores
    # (o Ubuntu 22.04 traz a 1.18), comente a linha abaixo e escreva
    # `listen 443 ssl http2;` nas duas diretivas acima.
    # Confira sua versão com: nginx -v
    http2 on;
    server_name crm.solarcosta.com.br;

    # --- TLS (o certbot preenche estas linhas ao emitir o certificado) ------
    ssl_certificate     /etc/letsencrypt/live/crm.solarcosta.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.solarcosta.com.br/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # --- Cabeçalhos de segurança --------------------------------------------
    # HSTS: só ligue depois de confirmar que o HTTPS funciona. Uma vez enviado,
    # o navegador recusa HTTP neste domínio pelo tempo do max-age.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    # O front usa Tailwind inline e busca CEP no ViaCEP.
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://viacep.com.br; frame-ancestors 'self'" always;

    # Não anuncia a versão do Nginx.
    server_tokens off;

    client_max_body_size 10M;

    # --- API ----------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # A API confia neste cabeçalho (trust proxy) para o rate limit do login.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Resposta de erro da API passa direto, sem página do Nginx no meio.
        proxy_intercept_errors off;
    }

    # Sonda de saúde, sem log para não poluir o access.log.
    location = /health {
        proxy_pass http://127.0.0.1:4000/health;
        access_log off;
    }

    # --- Front (build do Vite) ----------------------------------------------
    root /var/www/solarcosta;
    index index.html;

    # Os assets levam hash no nome, então podem ser cacheados para sempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: qualquer rota desconhecida devolve o index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nunca é cacheado, senão o deploy não chega no usuário.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    access_log /var/log/nginx/solarcosta-access.log;
    error_log  /var/log/nginx/solarcosta-error.log warn;
}
